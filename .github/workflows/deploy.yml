name: Deploy to Firebase Hosting

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: # can be manually ran from the Actions tab

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_OAUTH_CLIENT_ID: ${{ secrets.VITE_FIREBASE_OAUTH_CLIENT_ID }}
      VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Firebase config
        run: |
          clean() { printf '%s' "$1" | tr -d '"\r\n '; }
          jq -n \
            --arg apiKey            "$(clean "$VITE_FIREBASE_API_KEY")" \
            --arg authDomain        "$(clean "$VITE_FIREBASE_AUTH_DOMAIN")" \
            --arg projectId         "$(clean "$VITE_FIREBASE_PROJECT_ID")" \
            --arg storageBucket     "$(clean "$VITE_FIREBASE_STORAGE_BUCKET")" \
            --arg messagingSenderId "$(clean "$VITE_FIREBASE_MESSAGING_SENDER_ID")" \
            --arg appId             "$(clean "$VITE_FIREBASE_APP_ID")" \
            --arg firestoreDatabaseId "$(clean "$VITE_FIRESTORE_DATABASE_ID")" \
            '{apiKey:$apiKey, authDomain:$authDomain, projectId:$projectId,
              storageBucket:$storageBucket, messagingSenderId:$messagingSenderId,
              appId:$appId, firestoreDatabaseId:$firestoreDatabaseId}' \
            > firebase-applet-config.json

      - name: Build
        run: bun run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
