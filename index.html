    <script>
      // Safeguard against browser extensions / preview interceptors attempting to overwrite getter-only window.fetch
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if property cannot be redefined
        }
      })();
    </script>
